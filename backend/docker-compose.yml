services:
  redis:
    image: redis:7-alpine
    container_name: teepas_redis

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - teepas_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - teepas-net

  postgres:
    image: postgres:16-alpine
    container_name: teepas_postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - teepas_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - teepas-net

volumes:
  teepas_redis_data:
  teepas_pg_data:

networks:
  teepas-net:
    driver: bridge
services:
  redis:
    image: redis:7-alpine
    container_name: teepas_redis
    ports:
      - "6379:6379"
    volumes:
      - teepas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - teepas-net

  mongodb:
    image: mongo:8.0
    container_name: teepas_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - teepas_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teepas-net

volumes:
  teepas_redis_data:
  teepas_mongo_data:

networks:
  teepas-net:
    driver: bridge
